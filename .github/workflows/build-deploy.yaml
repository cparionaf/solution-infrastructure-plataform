name: Terragrunt Deployment

on:
 workflow_dispatch:
 push:
   branches:
     - dev
     - main
permissions:
 id-token: write
 contents: read

env:
 TF_IN_AUTOMATION: true

jobs:
 init-plan:
   name: 'Init and Plan Infrastructure'
   runs-on: ubuntu-latest
   environment: ${{ github.ref_name }}
   
   steps:
     - uses: actions/checkout@v4

     - name: create directory to pass ssh-agent socket
       run: "mkdir -p /home/runner/work/_temp/_github_workflow"
             
     - uses: webfactory/ssh-agent@v0.9.0
       with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
          ssh-auth-sock: "/home/runner/work/_temp/_github_workflow/ssh-agent.sock"

     - uses: aws-actions/configure-aws-credentials@v4
       with:
         role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
         aws-region: ${{ vars.AWS_REGION }}

     - name: Terraform Init
       uses: gruntwork-io/terragrunt-action@v2
       id: init
       with:
        tf_version: ${{ vars.TF_VERSION }}
        tg_version: ${{ vars.TG_VERSION }}
        tg_dir: "./${{ github.ref_name }}"
        tg_command: "run-all init"  
       env:
         SSH_AUTH_SOCK: "/github/workflow/ssh-agent.sock"
  
     - name: Terraform Plan
       uses: gruntwork-io/terragrunt-action@v2
       id: plan
       with:
         tf_version: ${{ vars.TF_VERSION }}
         tg_version: ${{ vars.TG_VERSION }}
         tg_dir: "./${{ github.ref_name }}"
         tg_command: "run-all plan"
       env:
          SSH_AUTH_SOCK: "/github/workflow/ssh-agent.sock"
  
 apply:
  name: 'Apply Infrastructure'
  needs: init-plan
  runs-on: ubuntu-latest
  environment: ${{ github.ref_name }}
  steps:
    - uses: actions/checkout@v4

    - name: create directory to pass ssh-agent socket
      run: "mkdir -p /home/runner/work/_temp/_github_workflow"
            
    - uses: webfactory/ssh-agent@v0.9.0
      with:
         ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
         ssh-auth-sock: "/home/runner/work/_temp/_github_workflow/ssh-agent.sock"

    - uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
        aws-region: ${{ vars.AWS_REGION }}  

    - name: Terraform Apply
      uses: gruntwork-io/terragrunt-action@v2
      with:
        tf_version: ${{ vars.TF_VERSION }}
        tg_version: ${{ vars.TG_VERSION }}
        tg_dir: "./${{ github.ref_name }}"
        tg_command: "run-all apply"
        tg_add_approve: 1
      env:
         SSH_AUTH_SOCK: "/github/workflow/ssh-agent.sock"
